<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Social command center</title>
<style>
:root {
  --ink: #251f21;
  --ink-2: #585254;
  --ink-4: #b0adad;
  --hairline: #eae9ea;
  --teal: #73a89a;
  --sand: #f4efec;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--sand);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 15px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.card {
  background: #fff;
  max-width: 720px;
  margin: 0 auto;
  min-height: 100vh;
  padding: 24px 20px 48px;
}
@media (min-width: 768px) {
  .card { margin: 32px auto; border-radius: 24px; padding: 36px; min-height: auto; box-shadow: 0 8px 30px rgba(37,31,33,.08); }
}
h1 {
  font-family: Georgia, "Times New Roman", serif;
  font-weight: 400;
  font-size: 30px;
  letter-spacing: -0.02em;
  margin: 8px 0 4px;
}
.fact { color: var(--teal); margin: 0 0 4px; font-size: 14px; }
.intro { color: var(--ink-2); margin: 0 0 8px; }
nav.tabs {
  display: flex; gap: 20px;
  border-bottom: 1px solid var(--hairline);
  margin: 16px 0 20px;
}
nav.tabs a {
  padding: 10px 0;
  color: var(--ink-2);
  text-decoration: none;
  font-size: 15px;
}
nav.tabs a.active { color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }
h2 {
  font-family: Georgia, "Times New Roman", serif;
  font-weight: 400;
  font-size: 21px;
  letter-spacing: -0.02em;
  margin: 32px 0 8px;
}
.counts { margin: 0; color: var(--ink-2); font-size: 14px; }
.empty { margin: 0; padding: 10px 0; color: var(--ink-2); border-top: 1px solid var(--hairline); }
.item {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 0;
  border-top: 1px solid var(--hairline);
}
.pill {
  flex: none; min-width: 96px; min-height: 44px;
  border-radius: 4px;
  border: 1px solid var(--hairline);
  background: transparent;
  color: var(--ink-2);
  font: inherit; font-size: 13px;
  cursor: pointer;
}
.pill[data-status="scheduled"] { border-color: var(--teal); color: var(--teal); }
.pill[data-status="posted"] { border-color: var(--teal); background: var(--teal); color: #fff; }
.item-main { flex: 1; min-width: 0; }
.item-name { font-weight: 600; overflow-wrap: anywhere; }
.item-time { color: var(--ink-2); font-size: 13px; }
.item[data-status="posted"] .item-name { color: var(--ink-4); text-decoration: line-through; }
.remove {
  flex: none; min-width: 44px; min-height: 44px;
  border: 0; background: transparent;
  color: var(--ink-2); font-size: 20px; line-height: 1;
  cursor: pointer;
}
.qform { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 12px; }
.qform input {
  font: inherit; color: var(--ink);
  background: #fff;
  border: 1px solid var(--hairline);
  border-radius: 4px;
  padding: 10px 12px;
  min-height: 44px;
  flex: 1 1 140px; min-width: 0;
}
.qform button {
  flex: none; min-height: 44px;
  font: inherit;
  border: 1px solid var(--hairline);
  border-radius: 4px;
  background: #fff;
  color: var(--ink);
  padding: 8px 18px;
  cursor: pointer;
}
.trend { padding: 12px 0; border-top: 1px solid var(--hairline); }
.trend-name { font-weight: 600; }
.trend-detail { color: var(--ink-2); margin: 2px 0 6px; }
a { color: var(--teal); }
.callout {
  background: var(--sand);
  border-radius: 8px;
  padding: 14px 16px;
  margin: 16px 0 8px;
}
.callout-title { font-weight: 600; margin-bottom: 4px; }
.callout p { margin: 0; color: var(--ink-2); }
footer {
  margin-top: 40px;
  padding-top: 16px;
  border-top: 1px solid var(--hairline);
  color: var(--ink-2);
  font-size: 14px;
}
</style>
</head>
<body>
<div class="card">
  <h1>Social command center</h1>
  <p class="fact">Trends checked 22 Sep 2026</p>
  <p class="intro">Queue what you make, then check what is hot across your lanes.</p>
  <nav class="tabs">
    <a href="#queue" id="tab-queue">Content queue</a>
    <a href="#hot" id="tab-hot">What's hot</a>
  </nav>
  <main id="view"></main>
  <footer id="foot"></footer>
</div>
<script>
var PLATFORMS = ['Facebook', 'TikTok', 'Instagram', 'Pinterest', 'Threads', 'YouTube'];
var STATUS_ORDER = ['held', 'scheduled', 'posted'];
var STATUS_LABEL = { held: 'Held', scheduled: 'Scheduled', posted: 'Posted' };
var STORE_KEY = 'social-command-center-queue-v1';

function loadQueues() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (raw) { var p = JSON.parse(raw); if (p && typeof p === 'object') return p; }
  } catch (e) {}
  return {};
}
function saveQueues(q) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(q)); } catch (e) {}
}
var queues = loadQueues();

function nextStatus(s) { return STATUS_ORDER[(STATUS_ORDER.indexOf(s) + 1) % STATUS_ORDER.length]; }

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderQueue() {
  var html = '<p class="intro">Your holding area for everything you make. Tap a status pill to move a piece from held to scheduled to posted, and tap again to cycle back. Add the planned post time so you know what goes out when.</p>';
  for (var i = 0; i < PLATFORMS.length; i++) {
    var p = PLATFORMS[i];
    var items = queues[p] || [];
    var c = { held: 0, scheduled: 0, posted: 0 };
    for (var j = 0; j < items.length; j++) c[items[j].status]++;
    html += '<h2>' + p + '</h2>';
    html += '<p class="counts">' + c.held + ' held &middot; ' + c.scheduled + ' scheduled &middot; ' + c.posted + ' posted</p>';
    if (items.length === 0) {
      html += '<p class="empty">Nothing here yet. Add your first piece below.</p>';
    } else {
      for (var k = 0; k < items.length; k++) {
        var it = items[k];
        html += '<div class="item" data-status="' + it.status + '">' +
          '<button type="button" class="pill" data-status="' + it.status + '" data-act="cycle" data-platform="' + p + '" data-id="' + it.id + '" aria-label="Status: ' + STATUS_LABEL[it.status] + '. Tap to advance.">' + STATUS_LABEL[it.status] + '</button>' +
          '<div class="item-main"><div class="item-name">' + esc(it.name) + '</div>' +
          (it.time ? '<div class="item-time">Planned: ' + esc(it.time) + '</div>' : '') + '</div>' +
          '<button type="button" class="remove" data-act="remove" data-platform="' + p + '" data-id="' + it.id + '" aria-label="Remove ' + esc(it.name) + '">&times;</button></div>';
      }
    }
    html += '<div class="qform">' +
      '<input id="name-' + i + '" placeholder="New ' + p + ' idea" aria-label="New ' + p + ' idea">' +
      '<input id="time-' + i + '" placeholder="Planned post time" aria-label="Planned post time for ' + p + '">' +
      '<button type="button" data-act="add" data-platform="' + p + '" data-idx="' + i + '">Add</button></div>';
  }
  return html;
}

var LANES = [
  { category: 'AI agents', trends: [
    { name: "OpenAI's Agents API", detail: "Launched Sep 10: build and run long-running cloud agents on the Codex harness, fully managed. 'Watch my agent do three hours of work' demos are the natural format.", source: 'OpenAI', url: 'https://openai.com/index/introducing-the-agents-api' },
    { name: "Meta's Muse goes mainstream", detail: "2.5M downloads in 13 days. Personal agents are crossing from early adopters to everyone - the 'chatbot vs. agent' explainer is timely.", source: 'The Meridiem', url: 'https://www.themeridiem.com/ai/2026/09/22/meta-s-muse-crosses-2-5m-downloads-as-ai-agents-challenge-chatbots' },
    { name: "Product Hunt's #1 of the day is an agent app", detail: 'Superset Mobile - run your coding agents from an iPhone, review diffs, merge PRs away from the desk - took Product of the Day on Sep 21 with 369+ upvotes. Agent tooling is what the maker crowd is voting for.', source: 'Product Hunt Launch Dashboard', url: 'https://hunted.space/dashboard/superset-5' },
    { name: 'Agents vs. platforms: the permission fight', detail: "Amazon moved to block Muse's shopping agent while fresh benchmarks put top agents at 16% on hard financial tasks. Honest 'what agents still can't do' content performs.", source: 'Agent Brief', url: 'https://news.agentcommunity.org/issues/2026-09-22-agent-permissions-meet' },
    { name: 'Voice agents get real', detail: "Phonely's Alma model, trained on 10M+ real phone calls, handles interruptions and background noise. Phone-call demos are inherently watchable.", source: 'Agentic AI News', url: 'https://agentic.ai/news' }
  ]},
  { category: 'AI music', trends: [
    { name: 'Suno v6, rebuilt on licensed music', detail: 'Sep 9: new models developed with Warner, BMG and Believe - faster, more expressive, more creator control, with remix tools for participating artists coming.', source: 'Suno', url: 'https://about.suno.com/blog/introducing-v6' },
    { name: 'Universal and Sony sue Suno again', detail: "Sep 18: the second lawsuit calls v6 'the fruit of the same poisoned tree' even as labels license. The lawsuit-vs-licensing whiplash is the story to explain.", source: 'Music Business Worldwide', url: 'https://www.musicbusinessworldwide.com/universal-and-sony-sue-suno-for-a-second-time-claiming-platforms-v6-models-are-the-fruit-of-the-same-poisoned-tree/' },
    { name: 'What the label deals mean for artists', detail: "LA Times, Sep 21: artists get a choice and a cut, but payout terms are undisclosed. A 'what this means for you' breakdown earns saves.", source: 'Los Angeles Times', url: 'https://www.latimes.com/entertainment-arts/business/story/2026-09-21/ai-music-licensing-deals-labels-artists-who-benefits' },
    { name: 'AI artists are a working lane', detail: 'Sienna Rose sits near 3M monthly Spotify listeners with three songs in the Viral Top 50, and Nyla Stone is pulling the same trick on TikTok. Persona-first AI artist content keeps proving out.', source: 'BBC News', url: 'https://www.bbc.co.uk/news/articles/cq6v83gq66eo' }
  ]},
  { category: 'AI film', trends: [
    { name: "Hollywood's AI guard, mapped", detail: 'Variety, Sep 17: ten companies from Particle 6 to Higgsfield to Runway are shaping AI film while the industry splits over it. Name-drop content for the film-literate audience.', source: 'Variety', url: 'https://variety.com/2026/film/news/ai-hollywood-particle-6-higgsfield-innovative-runway-1236865085/' },
    { name: "Runway's Project Luxo", detail: "Runway claims AI video has crossed the uncanny valley - realism, consistency and control that can carry actual stories. 'Can you tell?' reaction formats fit.", source: 'Runway', url: 'https://runway.com/news/company-news/project-luxo' },
    { name: 'AI film festivals are legit now', detail: "Fast Company on Runway's festival: ten AI shorts, all generated, and the medium has come far enough to be taken seriously. Recap and review formats work.", source: 'Fast Company', url: 'https://www.fastcompany.com/91565229/runway-ai-film-festival' },
    { name: '50 films for the price of one blockbuster', detail: "Runway's CEO: AI could let Hollywood make 50 films instead of one $100M bet. Strong hook for a take on what happens to mid-budget movies.", source: 'TechCrunch', url: 'https://techcrunch.com/2026/04/16/runway-ceo-says-ai-could-help-hollywood-make-50-films-instead-of-one-100m-blockbuster/' }
  ]},
  { category: 'AI video', trends: [
    { name: "Sora's API dies Sep 24", detail: "Two days out: the app shut in April, the API goes dark Sep 24, and Disney's planned $1B investment went with it. 'Migrating off Sora' content is urgent this week.", source: 'Runtime Wire', url: 'https://runtimewire.com/article/openai-will-shut-sora-s-api-as-kling-turns-ai-video-into-real-revenue' },
    { name: 'Veo 3.1 is the consensus pick', detail: "Best-of lists now crown Google's Veo 3.1 for realism - with Google's own Gemini Omni Flash already outranking it on the arena.", source: 'Toolbit', url: 'https://www.toolbit.ai/blog/best-ai-video-generators-2026' },
    { name: 'Kling is the revenue story', detail: 'Kling 3.0 raised $2.8B after topping RMB850M in a quarter. AI video winners are being picked on unit economics, not launch-day virality.', source: 'Runtime Wire', url: 'https://runtimewire.com/article/openai-will-shut-sora-s-api-as-kling-turns-ai-video-into-real-revenue' },
    { name: 'Native 4K with synced audio is table stakes', detail: 'Six models now do 4K, synchronized audio, multi-shot storyboards and real camera work. Side-by-side comparison formats have fresh material.', source: 'AI Journ', url: 'https://aijourn.net/best-ai-video-generators/' }
  ]},
  { category: 'AI images', trends: [
    { name: 'Nano Banana Pro owns text-in-image', detail: "Google's Gemini 3 Pro Image hits 94% text accuracy vs Midjourney's 10% on a widely cited benchmark. Poster, thumbnail and meme-text workflows are the demo.", source: 'Tech Insider', url: 'https://tech-insider.org/ca/nano-banana-pro-vs-midjourney-vs-flux-2-2026/' },
    { name: 'Midjourney V8.2 keeps the look', detail: 'Still the default for the painterly, agency-style aesthetic. Same-prompt-across-models comparisons keep performing.', source: 'AI Indigo', url: 'https://aiindigo.com/blog/midjourney-review-the-state-of-ai-art-in-2026' },
    { name: 'FLUX 3: video out, image pending', detail: "The video half is live as a paid API; the open image weights still aren't. Local-generation guides (what runs on 8, 16, 24 GB) are search bait.", source: 'Medium', url: 'https://medium.com/@anubhavgoyal101/is-flux-3-usable-for-local-image-generation-yet-5d89d4ca8fdc' },
    { name: 'The training-data debate has a new twist', detail: 'Top of r/artificial right now: a painter with work at MoMA and the Met published 50 years of work as an open AI dataset and shared what he learned. Artist-perspective content on AI training pulls strong discussion.', source: 'Reddit r/artificial', url: 'https://www.reddit.com/r/artificial/hot/' },
    { name: 'Editing beat generation', detail: "GPT Image 2.5 and instruction editing shifted the core task from 'make' to 'change'. Before/after edits are the format; C2PA provenance is the credibility angle.", source: 'Machine Learning Guide', url: 'https://getpodcast.com/it/podcast/machine-learning-guide/mla-025-ai-image-generation-2026-gpt-image-nano-banana-midjourney-flux_7b85177cc0' }
  ]},
  { category: 'AI tools', trends: [
    { name: 'Grok 4.7', detail: 'Sep 21: positioned for coding and knowledge work at twice the speed and half the price - with user reports of doubled token burn as the honest caveat.', source: 'SpaceXAI', url: 'https://x.ai/news/grok-4-7' },
    { name: 'Jevtown: test content on 10,000 AI readers', detail: 'New on Product Hunt: simulate audience reactions before you post. A creator testing their own content on it is a self-referential post waiting to happen.', source: 'AIToolly', url: 'https://aitoolly.com/ai-news/article/2026-09-22-jevtown-launches-on-product-hunt-simulating-10000-ai-audience-reactions-before-content-goes-live' },
    { name: 'Creatify Boreal: realtime video at a cent a second', detail: 'Sep 21: a five-second clip in about five seconds, near ad-tier quality. Speed-and-price demos are inherently postable.', source: 'MarTech360', url: 'https://www.martech360.com/news/ai-automation/creatify-labs-launches-boreal' },
    { name: 'Text Agent Store: agents in your phone book', detail: 'A marketplace of AI agents you text like a contact, 308+ Product Hunt upvotes since Sep 17. Texting-an-agent is a demo format anyone can grasp in five seconds.', source: 'Product Hunt Launch Dashboard', url: 'https://webmail.hunted.space/dashboard/text-agent-store' }
  ]},
  { category: 'AI automations', trends: [
    { name: 'n8n Assistant', detail: "Sep 9: describe the automation in a sentence and it drafts the workflow. Screen-record 'one sentence to a working workflow' - that is the post.", source: 'n8n Blog', url: 'https://blog.n8n.io/introducing-n8n-assistant/' },
    { name: 'n8n Agents', detail: 'Build an agent once, use it anywhere: chat directly, drop it in a workflow, connect it to Slack, or run it on a schedule. Strong tutorial angle.', source: 'n8n Community', url: 'https://community.n8n.io/t/introducing-n8n-agents-a-new-way-to-build-agents-you-set-up-once-and-use-anywhere/306323' },
    { name: 'Why 67% of AI automations fail', detail: 'Failure-rate content with fixes lands: human-in-the-loop at the tool-call level is the production pattern that actually works.', source: 'Congni Tech', url: 'https://blog.congni.tech/2026/09/14/why-67-of-ai-automations-fail-in-2026-and-how-n8n-make-fix-it/' },
    { name: 'The Zapier exodus', detail: 'Teams keep switching to n8n for nested JSON, native code blocks, and self-hosting that decouples cost from volume. Migration-story content.', source: 'Entrans', url: 'https://www.entrans.ai/blog/n8n-workflow-automation-trends' }
  ]}
];

function renderHot() {
  var html = '<p class="intro">What is getting traction across your seven lanes, scanned from TikTok Creative Center, YouTube trending, X, the Reddit AI subs, Product Hunt and the AI newsletters. Hot means recent with real public engagement behind it. Every item links its source so you can tap through and check the original before you build on it.</p>';
  html += '<div class="callout"><div class="callout-title">Formats pulling right now</div><p>Human-led workflow reveals, comedic AI mini-stories and product-result demos beat polished montages and avatar testimonials; the "AI is going to take your job / WHEN?!" gag is still running; and familiar formats (green screen, slideshow, beat-cut) get recognized before the first second plays. Sources: <a href="https://lightreel.ai/blogs/ai-generated-ugc-videos">Lightreel</a>, <a href="https://later.com/blog/instagram-reels-trends/">Later</a>, <a href="https://www.netinfluencer.com/tiktok-audiences-are-pulling-toward-six-formats-and-scrolling-past-the-ones-built-to-sell-q2-editing-format-index-finds/">NetInfluencer</a>. Check momentum before committing in the <a href="https://ads.tiktok.com/creative/creativeCenter/trends">TikTok Creative Center</a> trends dashboard - the Trends and Top Ads sections work signed out.</p></div>';
  for (var i = 0; i < LANES.length; i++) {
    var lane = LANES[i];
    html += '<h2>' + lane.category + '</h2>';
    for (var j = 0; j < lane.trends.length; j++) {
      var t = lane.trends[j];
      html += '<div class="trend"><div class="trend-name">' + esc(t.name) + '</div>' +
        '<div class="trend-detail">' + esc(t.detail) + '</div>' +
        '<a href="' + t.url + '" target="_blank" rel="noopener">Source: ' + esc(t.source) + '</a></div>';
    }
  }
  return html;
}

function render() {
  var hash = location.hash === '#hot' ? '#hot' : '#queue';
  document.getElementById('tab-queue').className = hash === '#queue' ? 'active' : '';
  document.getElementById('tab-hot').className = hash === '#hot' ? 'active' : '';
  var view = document.getElementById('view');
  var foot = document.getElementById('foot');
  if (hash === '#hot') {
    view.innerHTML = renderHot();
    foot.textContent = 'Trends scanned 22 Sep 2026. The Instinct file mirror refreshes each morning.';
  } else {
    view.innerHTML = renderQueue();
    foot.textContent = 'Check-offs and new items save in this browser automatically.';
  }
}

document.getElementById('view').addEventListener('click', function (e) {
  var btn = e.target.closest('button[data-act]');
  if (!btn) return;
  var platform = btn.getAttribute('data-platform');
  var act = btn.getAttribute('data-act');
  var items = queues[platform] || [];
  if (act === 'add') {
    var idx = btn.getAttribute('data-idx');
    var nameEl = document.getElementById('name-' + idx);
    var timeEl = document.getElementById('time-' + idx);
    var name = nameEl.value.trim();
    if (!name) return;
    items.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), name: name, time: timeEl.value.trim(), status: 'held' });
    queues[platform] = items;
  } else if (act === 'cycle') {
    var id = btn.getAttribute('data-id');
    for (var i = 0; i < items.length; i++) if (items[i].id === id) items[i].status = nextStatus(items[i].status);
  } else if (act === 'remove') {
    var rid = btn.getAttribute('data-id');
    queues[platform] = items.filter(function (it) { return it.id !== rid; });
  }
  saveQueues(queues);
  render();
});

window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
